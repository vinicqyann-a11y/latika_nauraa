<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MenuKu - Digital Cafe Menu</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8f0e5;
    color: #503727;
}

header {
    background: #704832;
    color: white;
    padding: 25px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

header h1 {
    font-size: 30px;
    margin-bottom: 5px;
}

header p {
    font-size: 14px;
}

main {
    max-width: 1250px;
    margin: auto;
    padding: 30px 20px;
}

.judul {
    text-align: center;
    margin-bottom: 20px;
}

.judul h2 {
    margin-bottom: 15px;
}

#cariMenu {
    width: 100%;
    max-width: 600px;
    padding: 14px 18px;
    border: 1px solid #d8c5b4;
    border-radius: 30px;
    font-size: 15px;
    background: white;
}

.layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 25px;
    align-items: start;
}

h3 {
    margin: 20px 0 15px;
}

.filter {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 11px 15px;
    background: #eadbcc;
    color: #503727;
    font-size: 14px;
}

.filter button.aktif,
.tambah,
.checkout {
    background: #704832;
    color: white;
}

.menu-container {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
}

.menu-card {
    background: #fffdf9;
    border: 1px solid #e4d6c8;
    border-radius: 13px;
    padding: 10px;
    overflow: hidden;
}

.menu-card img {
    width: 100%;
    height: 145px;
    object-fit: cover;
    border-radius: 9px;
    display: block;
    background: #eadbcc;
}

.menu-card h4 {
    margin: 12px 0 7px;
    font-size: 16px;
}

.deskripsi {
    color: #806e60;
    font-size: 13px;
    line-height: 1.5;
    min-height: 39px;
}

.harga {
    font-weight: bold;
    margin: 12px 0;
    color: #704832;
}

.tambah {
    width: 100%;
}

.keranjang {
    background: #fffdf9;
    border: 1px solid #e4d6c8;
    border-radius: 13px;
    padding: 18px;
    position: sticky;
    top: 15px;
}

.keranjang h3 {
    margin-top: 0;
}

#isiKeranjang {
    margin-top: 15px;
}

.item {
    padding: 12px 0;
    border-bottom: 1px solid #eadbcc;
    font-size: 13px;
}

.item-nama {
    font-weight: bold;
    margin-bottom: 8px;
}

.item-kontrol {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
}

.item-kontrol button {
    padding: 5px 10px;
}

.total {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: bold;
    margin: 20px 0;
}

.kosongkan {
    width: 100%;
}

footer {
    text-align: center;
    padding: 20px;
    background: #704832;
    color: white;
    font-size: 13px;
    margin-top: 25px;
}

@media (max-width: 900px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .keranjang {
        position: static;
    }

    .menu-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 420px) {
    main {
        padding: 20px 12px;
    }

    .menu-card img {
        height: 120px;
    }

    .menu-card h4 {
        font-size: 14px;
    }

    header {
        padding: 20px;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <h1>MenuKu</h1>
        <p>Menu Digital Cafe dan Restoran</p>
    </div>
    <p>Jajanan enak, pilihan makin banyak.</p>
</header>

<main>
    <section class="judul">
        <h2>Temukan Menu Favoritmu!</h2>
        <input
            type="search"
            id="cariMenu"
            placeholder="Cari makanan atau minuman..."
        >
    </section>

    <div class="layout">
        <section>
            <h3>Kategori Menu</h3>

            <div class="filter">
                <button class="aktif" data-kategori="Semua">Semua</button>
                <button data-kategori="Camilan">Camilan</button>
                <button data-kategori="Makanan">Makanan</button>
                <button data-kategori="Minuman">Minuman</button>
            </div>

            <h3>Daftar Menu</h3>
            <div id="daftarMenu" class="menu-container"></div>
        </section>

        <aside class="keranjang">
            <h3>Keranjang Pesanan</h3>

            <div id="isiKeranjang">
                <p>Belum ada pesanan.</p>
            </div>

            <div class="total">
                <span>Total</span>
                <span>Rp<span id="totalHarga">0</span></span>
            </div>

            <button class="kosongkan" id="kosongkan">
                Kosongkan Keranjang
            </button>
        </aside>
    </div>
</main>

<footer>
    © 2026 MenuKu - Menu Digital Cafe dan Restoran
</footer>

<script>
const menu = [

        deskripsi: "Cookie cokelat dengan pistachio.",

    },
    {

        deskripsi: "Pastry renyah dengan isian krim.",
        foto: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=600&q=80"
    },
    {

        kategori: "Camilan",
        harga: 20000,
        deskripsi: "Dessert lembut berlapis cokelat.",
        foto: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80"
    },
    {

    },
    {

        foto: "https://images.unsplash.com/photo-1551024506-0ec9c1c5c7c4?auto=format&fit=crop&w=600&q=80"
    },
    {
        nama: "Croissant Cokelat",
        kategori: "Camilan",
        harga: 14000,
        deskripsi: "Pastry berlapis dengan cokelat.",
        foto: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=600&q=80"
    },
    {
        nama: "Mochi",
        kategori: "Camilan",
        harga: 8000,

        foto: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=600&q=80"
    },

        foto: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=600&q=80"
    },
    {
        nama: "Kentang Goreng",

        harga: 12000,

        foto: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=600&q=80"
    },
    {

    },
    {

        harga: 12000,
        deskripsi: "Pisang renyah dengan topping.",
        foto: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=600&q=80"
    },
    {

    },
    {

        foto: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80"
    },
    {

        foto: "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=600&q=80"
    },
    {

        kategori: "Makanan",
        harga: 20000,
        deskripsi: "Burger dengan isian gurih.",
        foto: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80"
    },
    {
        nama: "Rice Bowl",
        kategori: "Makanan",
        harga: 20000,
        deskripsi: "Nasi dengan lauk pilihan.",
        foto: "https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=600&q=80"
    },
    {
        nama: "Matcha Latte",
        kategori: "Minuman",
        harga: 18000,
        deskripsi: "Matcha dengan susu creamy.",
        foto: "https://images.unsplash.com/photo-1515823064-d6e0c04616a7?auto=format&fit=crop&w=600&q=80"
    },
    {
        nama: "Boba Brown Sugar",
        kategori: "Minuman",
        harga: 18000,
        deskripsi: "Susu dengan boba dan gula aren.",
        foto: "https://images.unsplash.com/photo-1558857563-b371033873b8?auto=format&fit=crop&w=600&q=80"
    },
    {
        nama: "Es Kopi Susu",
        kategori: "Minuman",
        harga: 18000,
        deskripsi: "Kopi susu dingin yang nikmat.",
        foto: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=600&q=80"
    },
    {
        nama: "Strawberry Smoothie",
        kategori: "Minuman",
        harga: 16000,
        deskripsi: "Minuman stroberi yang segar.",
        foto: "https://images.unsplash.com/photo-1553530666-ba11a7da3888?auto=format&fit=crop&w=600&q=80"
    },
    {
        nama: "Chocolate Drink",
        kategori: "Minuman",
        harga: 16000,
        deskripsi: "Minuman cokelat dingin.",
        foto: "https://images.unsplash.com/photo-1542990253-0b8be4b8a5b1?auto=format&fit=crop&w=600&q=80"
    },
    {
        nama: "Lemon Tea",
        kategori: "Minuman",
        harga: 10000,
        deskripsi: "Teh lemon yang menyegarkan.",
        foto: "https://images.unsplash.com/photo-1513558161293-cdaf765edfd7?auto=format&fit=crop&w=600&q=80"
    }
];

let kategoriAktif = "Semua";
let keranjang = [];

const daftarMenu = document.getElementById("daftarMenu");
const cariMenu = document.getElementById("cariMenu");
const isiKeranjang = document.getElementById("isiKeranjang");
const totalHarga = document.getElementById("totalHarga");

function rupiah(angka) {
    return angka.toLocaleString("id-ID");
}

function tampilkanMenu() {
    const kata = cariMenu.value.toLowerCase();

    const hasil = menu.filter(item => {
        const cocokKata =
            item.nama.toLowerCase().includes(kata) ||
            item.deskripsi.toLowerCase().includes(kata);

        const cocokKategori =
            kategoriAktif === "Semua" ||
            item.kategori === kategoriAktif;

        return cocokKata && cocokKategori;
    });

    daftarMenu.innerHTML = "";

    if (hasil.length === 0) {
        daftarMenu.textContent = "Menu tidak ditemukan.";
        return;
    }

    hasil.forEach(item => {
        const kartu = document.createElement("article");
        kartu.className = "menu-card";

        const foto = document.createElement("img");
        foto.src = item.foto;
        foto.alt = item.nama;
        foto.loading = "lazy";

        foto.onerror = function() {
            this.style.display = "none";
        };

        const nama = document.createElement("h4");
        nama.textContent = item.nama;

        const deskripsi = document.createElement("p");
        deskripsi.className = "deskripsi";
        deskripsi.textContent = item.deskripsi;

        const harga = document.createElement("p");
        harga.className = "harga";
        harga.textContent = "Rp" + rupiah(item.harga);

        const tombol = document.createElement("button");
        tombol.className = "tambah";
        tombol.textContent = "Tambah ke Keranjang";
        tombol.addEventListener("click", () => {
            tambahKeranjang(item.nama);
        });

        kartu.append(foto, nama, deskripsi, harga, tombol);
        daftarMenu.appendChild(kartu);
    });
}

document.querySelectorAll(".filter button").forEach(tombol => {
    tombol.addEventListener("click", () => {
        kategoriAktif = tombol.dataset.kategori;

        document.querySelectorAll(".filter button").forEach(btn => {
            btn.classList.remove("aktif");
        });

        tombol.classList.add("aktif");
        tampilkanMenu();
    });
});

cariMenu.addEventListener("input", tampilkanMenu);

function tambahKeranjang(nama) {
    const item = menu.find(m => m.nama === nama);
    const ada = keranjang.find(m => m.nama === nama);

    if (ada) {
        ada.jumlah++;
    } else {
        keranjang.push({
            nama: item.nama,
            harga: item.harga,
            jumlah: 1
        });
    }

    tampilkanKeranjang();
}

function ubahJumlah(nama, angka) {
    const item = keranjang.find(m => m.nama === nama);
    if (!item) return;

    item.jumlah += angka;

    if (item.jumlah <= 0) {
        keranjang = keranjang.filter(m => m.nama !== nama);
    }

    tampilkanKeranjang();
}

function tampilkanKeranjang() {
    isiKeranjang.innerHTML = "";

    if (keranjang.length === 0) {
        isiKeranjang.textContent = "Belum ada pesanan.";
    }

    keranjang.forEach(item => {
        const baris = document.createElement("div");
        baris.className = "item";

        const nama = document.createElement("p");
        nama.className = "item-nama";
        nama.textContent = item.nama;

        const kontrol = document.createElement("div");
        kontrol.className = "item-kontrol";

        const subtotal = document.createElement("span");
        subtotal.textContent =
            "Rp" + rupiah(item.harga * item.jumlah);

        const tombolKurang = document.createElement("button");
        tombolKurang.textContent = "−";
        tombolKurang.addEventListener("click", () => {
            ubahJumlah(item.nama, -1);
        });

        const jumlah = document.createElement("span");
        jumlah.textContent = item.jumlah;

        const tombolTambah = document.createElement("button");
        tombolTambah.textContent = "+";
        tombolTambah.addEventListener("click", () => {
            ubahJumlah(item.nama, 1);
        });

        kontrol.append(
            subtotal, tombolKurang, jumlah, tombolTambah
        );

        baris.append(nama, kontrol);
        isiKeranjang.appendChild(baris);
    });

    const total = keranjang.reduce(
        (sum, item) => sum + item.harga * item.jumlah,
        0
    );

    totalHarga.textContent = rupiah(total);
}

document.getElementById("kosongkan").addEventListener("click", () => {
    keranjang = [];
    tampilkanKeranjang();
});

tampilkanMenu();
tampilkanKeranjang();
</script>

</body>
</html>
